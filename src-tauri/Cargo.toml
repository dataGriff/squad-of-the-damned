[package]
name = "squad-of-the-damned"
version = "0.1.0"
description = "8-bit platformer: four kids vs the classic monsters"
edition = "2021"

[lib]
name = "squad_of_the_damned_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
